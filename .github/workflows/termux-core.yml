name: Build Saman Aether Termux Core

on:
  push:
    tags:
      - "termux-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  AETHER_COMMIT: "311b573352bb67e494895ff67d20b002d075116a"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  android:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            archive: saman-aether-termux-arm64.tar.gz
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            archive: saman-aether-termux-armv7.tar.gz
          - abi: x86_64
            target: x86_64-linux-android
            archive: saman-aether-termux-x86_64.tar.gz

    steps:
      - name: Checkout Saman repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Checkout pinned Aether Core
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/Aether"
          git -C "$RUNNER_TEMP/Aether" init
          git -C "$RUNNER_TEMP/Aether" remote add origin https://github.com/CluvexStudio/Aether.git
          git -C "$RUNNER_TEMP/Aether" fetch --depth 1 origin "$AETHER_COMMIT"
          git -C "$RUNNER_TEMP/Aether" checkout --detach FETCH_HEAD
          grep -q '^version = "1.9.0"$' "$RUNNER_TEMP/Aether/aether/Cargo.toml"

      - name: Apply Smart Reconnect patch
        run: |
          set -euxo pipefail
          P="$GITHUB_WORKSPACE/android-app/aether-patches/smart-reconnect-all-modes.patch"
          test -s "$P"
          git -C "$RUNNER_TEMP/Aether" apply --check "$P"
          git -C "$RUNNER_TEMP/Aether" apply "$P"

      - name: Apply local proxy restart patch
        run: |
          set -euxo pipefail
          P="$GITHUB_WORKSPACE/android-app/aether-patches/local-proxy-reuseaddr.patch"
          test -s "$P"
          git -C "$RUNNER_TEMP/Aether" apply --check "$P"
          git -C "$RUNNER_TEMP/Aether" apply "$P"

      - name: Verify patched source
        run: |
          set -euxo pipefail
          grep -q 'smart reconnect WG' "$RUNNER_TEMP/Aether/aether/src/lib.rs"
          grep -q 'smart reconnect MASQUE' "$RUNNER_TEMP/Aether/aether/src/lib.rs"
          grep -q 'smart reconnect GOOL' "$RUNNER_TEMP/Aether/aether/src/lib.rs"
          grep -q 'set_reuseaddr(true)' "$RUNNER_TEMP/Aether/aether/src/socks.rs"
          git -C "$RUNNER_TEMP/Aether" diff --check

      - name: Build patched Termux executable
        working-directory: ${{ runner.temp }}/Aether/aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          cargo ndk -t "${{ matrix.abi }}" --platform 24 build --release

      - name: Package executable
        run: |
          set -euxo pipefail

          BIN="$RUNNER_TEMP/Aether/aether/target/${{ matrix.target }}/release/aether"
          test -f "$BIN"

          mkdir -p "$RUNNER_TEMP/pkg"
          cp "$BIN" "$RUNNER_TEMP/pkg/saman-aether-core"
          chmod +x "$RUNNER_TEMP/pkg/saman-aether-core"

          file "$RUNNER_TEMP/pkg/saman-aether-core"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" version >/dev/null 2>&1 || true

          tar -C "$RUNNER_TEMP/pkg" \
            -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" \
            saman-aether-core

          tar -tzf "$GITHUB_WORKSPACE/${{ matrix.archive }}" | grep -qx 'saman-aether-core'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish Termux release
    needs: android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/termux-v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euxo pipefail
          cd dist
          for f in ./*.tar.gz; do
            sha256sum "$f" > "${f#./}.sha256"
          done
          ls -lh
          cat ./*.sha256

      - name: Prepare release notes
        run: |
          cat > /tmp/termux-notes.md <<'NOTES'
          # Saman Aether Termux Core

          Patched Aether Core for **Termux + Termux:Widget**, based on Aether Core v1.9.0 source.

          ## Patched core build

          - Aether v1.9.0 base
          - GOOL stability fixes from Aether v1.9.0
          - Improved WireGuard task/panic resilience from upstream v1.8.0
          - Upstream authentication fix and optimized HTTP proxy handling
          - Reconnect zero-value guard from upstream v1.8.0
          - Smart Reconnect for WireGuard, MASQUE H3/H2 and GOOL
          - WireGuard cached RTT limit: 650 ms
          - MASQUE H3 cached verification limit: 1800 ms
          - MASQUE H2 cached verification limit: 2500 ms
          - Short-lived path/pair threshold: 20 seconds
          - Fresh scans remain `balanced`
          - Fresh-scan results are not rejected by the cache thresholds
          - Local SOCKS5/HTTP listeners use reusable address binding for cleaner restarts
          - SOCKS5: `127.0.0.1:1819`
          - HTTP CONNECT: `127.0.0.1:1820`
          - `--quick-reconnect`
          - `--reconnect-secs 1`
          - MASQUE H3, MASQUE H2, WireGuard and GOOL

          Architectures:
          - arm64
          - armv7
          - x86_64

          The executable in these archives is named `saman-aether-core` so it can coexist with an upstream `aether` installation.

          Source:
          https://github.com/velnox4827/saman-aether

          Upstream:
          https://github.com/CluvexStudio/Aether

          License: GNU AGPL-3.0
          NOTES

      - name: Publish non-latest Termux release
        uses: softprops/action-gh-release@v2
        with:
          name: Saman Aether Termux ${{ github.ref_name }}
          body_path: /tmp/termux-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
          make_latest: false
          draft: false
          prerelease: false
