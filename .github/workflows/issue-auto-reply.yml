name: Issue Auto Reply

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  acknowledge:
    if: github.repository == 'velnox4827/saman-aether'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Post deterministic acknowledgment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- saman-tunnel-issue-ack -->'
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq '[.[] | select(.body | contains("'"$MARKER"'"))] | length')"
          if [ "$EXISTING" -gt 0 ]; then
            echo "ack already present; skipping"
            exit 0
          fi
          cat > /tmp/ack.md <<'ACK'
          سلام، issue شما در Saman Tunnel ثبت شد. این issue به‌صورت خودکار دریافت شد. لطفاً اطلاعات قابل انتشار مانند نسخه برنامه، معماری دستگاه، mode مورد استفاده، و شرح خطا را در ادامه همین issue قرار دهید. از ارسال token، private key، password و اطلاعات حساس خودداری کنید.

          <!-- saman-tunnel-issue-ack -->
          ACK
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/ack.md
