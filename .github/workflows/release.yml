name: Release Saman Tunnel Stable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  AETHER_COMMIT: "a916ff6fbbb4ebafe8314c53cf3718eb51dcae53"
  CARGO_NDK_VERSION: "4.1.2"
  RELEASE_CERT_SHA256: "03233edadf89ed27c7cf80452916a7bd25e8c74abe0f12d2eefcb8b290b48805"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout

      - name: Validate version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"${V}\"" android-app/app/build.gradle.kts

      - uses: actions/setup-java@v5
        name: Java 17
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        name: Android SDK

      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        name: Gradle
        with:
          gradle-version: "8.13"

      - uses: dtolnay/rust-toolchain@stable
        name: Rust ARM targets
        with:
          toolchain: "1.89.0"
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Checkout Aether Core
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/Aether"
          git -C "$RUNNER_TEMP/Aether" init
          git -C "$RUNNER_TEMP/Aether" remote add origin https://github.com/CluvexStudio/Aether.git
          git -C "$RUNNER_TEMP/Aether" fetch --depth 1 origin "$AETHER_COMMIT"
          git -C "$RUNNER_TEMP/Aether" checkout --detach FETCH_HEAD
          grep -q '^version = "1.8.0"$' "$RUNNER_TEMP/Aether/aether/Cargo.toml"

      - name: Apply Saman Smart Reconnect patch
        run: |
          set -euxo pipefail
          PATCH="$GITHUB_WORKSPACE/android-app/aether-patches/smart-reconnect-all-modes.patch"
          test -s "$PATCH"
          git -C "$RUNNER_TEMP/Aether" apply --check "$PATCH"
          git -C "$RUNNER_TEMP/Aether" apply "$PATCH"

      - name: Apply Saman local proxy restart patch
        run: |
          set -euxo pipefail
          PATCH="$GITHUB_WORKSPACE/android-app/aether-patches/local-proxy-reuseaddr.patch"
          test -s "$PATCH"
          git -C "$RUNNER_TEMP/Aether" apply --check "$PATCH"
          git -C "$RUNNER_TEMP/Aether" apply "$PATCH"
          grep -q 'bind_reusable_tcp_listener' "$RUNNER_TEMP/Aether/aether/src/socks.rs"
          grep -q 'set_reuseaddr(true)' "$RUNNER_TEMP/Aether/aether/src/socks.rs"

      - name: Build Aether ARM64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/Aether/aether"
          cargo ndk -t arm64-v8a --platform 24 build --release --lib
          mkdir -p "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/libaether.so "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a/libaether.so"

      - name: Build Aether ARM32
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/Aether/aether"
          cargo ndk -t armeabi-v7a --platform 24 build --release --lib
          mkdir -p "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/armeabi-v7a"
          cp target/armv7-linux-androideabi/release/libaether.so "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/armeabi-v7a/libaether.so"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAMAN_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/saman-release.jks"

      - name: Build signed Stable APKs
        working-directory: android-app
        env:
          STORE_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAMAN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PSAMAN_KEYSTORE_FILE="$RUNNER_TEMP/saman-release.jks" \
            -PSAMAN_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PSAMAN_KEY_ALIAS="$KEY_ALIAS" \
            -PSAMAN_KEY_PASSWORD="$KEY_PASSWORD"
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Verify Stable APKs
        run: |
          set -euxo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*release*.apk' | head -n1)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*release*.apk' | head -n1)"
          UNI="$(find "$O" -type f -name '*universal*release*.apk' | head -n1)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"

          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libaether.so'
          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libsamanbridge.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libaether.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libsamanbridge.so'
          unzip -l "$UNI" | grep -q 'lib/arm64-v8a/libaether.so'
          unzip -l "$UNI" | grep -q 'lib/armeabi-v7a/libaether.so'

          unzip -p "$UNI" lib/arm64-v8a/libsamanbridge.so > /tmp/b64.so
          unzip -p "$UNI" lib/armeabi-v7a/libsamanbridge.so > /tmp/b32.so
          readelf -d /tmp/b64.so | grep -q 'Shared library: \[libaether.so\]'
          readelf -d /tmp/b32.so | grep -q 'Shared library: \[libaether.so\]'
          if readelf -d /tmp/b64.so | grep -q '/home/runner'; then exit 1; fi
          if readelf -d /tmp/b32.so | grep -q '/home/runner'; then exit 1; fi

          V="${GITHUB_REF_NAME#v}"
          for APK in "$A64" "$A32" "$UNI"; do
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
            grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<<"$CERTS"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            echo "$B" | grep -q "package: name='com.saman.tunnel'"
            echo "$B" | grep -q "versionName='${V}'"
            echo "$B" | grep -q "application-label:'Saman Tunnel'"
          done

          M="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$UNI" AndroidManifest.xml)"
          echo "$M" | grep -q 'SamanTunnelWidget'
          echo "$M" | grep -q 'aether_core'
          echo "$M" | grep -q 'TunnelStateReceiver'

      - name: Prepare release files
        run: |
          set -euxo pipefail
          O="android-app/app/build/outputs/apk"
          T="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp "$(find "$O" -type f -name '*arm64-v8a*release*.apk' | head -n1)" "dist/Saman-Tunnel-${T}-arm64-v8a.apk"
          cp "$(find "$O" -type f -name '*armeabi-v7a*release*.apk' | head -n1)" "dist/Saman-Tunnel-${T}-armeabi-v7a.apk"
          cp "$(find "$O" -type f -name '*universal*release*.apk' | head -n1)" "dist/Saman-Tunnel-${T}-universal-arm.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS
          for A in *.apk; do sha256sum "$A" > "${A}.sha256"; done
          ls -lh

      - name: Release notes
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          awk -v heading="## $TAG" '
            $0 == heading { found=1 }
            found && $0 ~ /^## / && $0 != heading { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            printf '# Saman Tunnel %s\n\nSee CHANGELOG.md for details.\n' "$TAG" > /tmp/notes.md
          fi
          cat >> /tmp/notes.md <<'NOTES'

          Verify downloaded APKs with the attached `SHA256SUMS` file and verify signing-certificate continuity before installation.
          NOTES

      - name: Create GitHub Stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Saman Tunnel ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            --latest
