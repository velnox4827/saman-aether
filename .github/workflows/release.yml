name: Build Saman Tunnel Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  AETHER_COMMIT: "6175b67df370ab856bcee07fe85b524031903956"
  RELEASE_TAG: "v2.2.0"
  RELEASE_CERT_SHA256: "03233edadf89ed27c7cf80452916a7bd25e8c74abe0f12d2eefcb8b290b48805"

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-debug.') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Validate version
        run: |
          set -euxo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$GITHUB_REF_NAME" = "$RELEASE_TAG"; fi
          V="${RELEASE_TAG#v}"
          grep -q 'versionCode = 20200' android-app/app/build.gradle.kts
          grep -q 'minSdk = 24' android-app/app/build.gradle.kts
          grep -q "versionName = \"${V}\"" android-app/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests and lint
        working-directory: android-app
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            --stacktrace \
            --console=plain

      - name: Verify and retain signed v2.1.0 Aether 2.3.0 / Psiphon binaries
        run: bash android-app/scripts/stage-retained-aether.sh

      - name: Go 1.27.1 for pinned Xray-core
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build and validate Xray-core v26.11.9 (both ARM ABIs)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: bash android-app/scripts/build-xray.sh

      - name: Build official HEV 2.20.0 tun2socks
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          HEV="$GITHUB_WORKSPACE/android-app/third_party/hev-socks5-tunnel"
          HEV_OUT="$RUNNER_TEMP/hev-libs"
          APP_LIBS="$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs"
          OBJ="$RUNNER_TEMP/hev-obj"
          test "$(git -C "$HEV" rev-parse HEAD)" = "75dbc1e9ace6c70d3d1b94df7c283efe1de7effc"
          "$ANDROID_NDK_HOME/ndk-build" \
            -C "$HEV" \
            NDK_PROJECT_PATH="$HEV" \
            APP_BUILD_SCRIPT="$HEV/Android.mk" \
            NDK_APPLICATION_MK="$HEV/Application.mk" \
            NDK_LIBS_OUT="$HEV_OUT" \
            NDK_OUT="$OBJ" \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM="android-24" \
            APP_CFLAGS="-O3 -DANDROID -DPKGNAME=com/saman/tunnel -DCLSNAME=HevBridge"
          test -s "$HEV_OUT/arm64-v8a/libhev-socks5-tunnel.so"
          test -s "$HEV_OUT/armeabi-v7a/libhev-socks5-tunnel.so"

          # Preserve Aether: build HEV outside app/src/main/jniLibs.
          test -s "$APP_LIBS/arm64-v8a/libaether.so"
          test -s "$APP_LIBS/armeabi-v7a/libaether.so"

          install -Dm755 "$HEV_OUT/arm64-v8a/libhev-socks5-tunnel.so" "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so"
          install -Dm755 "$HEV_OUT/armeabi-v7a/libhev-socks5-tunnel.so" "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"

          # Both native engines must coexist before Gradle/CMake starts.
          test -s "$APP_LIBS/arm64-v8a/libaether.so"
          test -s "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so"
          test -s "$APP_LIBS/armeabi-v7a/libaether.so"
          test -s "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"

          echo "ARM64 native libs:"
          ls -lh "$APP_LIBS/arm64-v8a/libaether.so" "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so"
          echo "ARMv7 native libs:"
          ls -lh "$APP_LIBS/armeabi-v7a/libaether.so" "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"

          sha256sum \
            "$APP_LIBS/arm64-v8a/libaether.so" \
            "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so" \
            "$APP_LIBS/armeabi-v7a/libaether.so" \
            "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAMAN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/saman-release.jks"

      - name: Build signed Stable APKs
        working-directory: android-app
        env:
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_FILE: ${{ runner.temp }}/saman-release.jks
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_ALIAS: ${{ secrets.SAMAN_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify Stable APKs
        run: |
          set -euxo pipefail

          O="android-app/app/build/outputs/apk"

          A64="$(find "$O" -type f -name '*arm64-v8a*release*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*release*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*release*.apk' -print -quit)"

          test -f "$A64"
          test -f "$A32"
          test -f "$UNI"

          python3 - "$A64" "$A32" "$UNI" <<'PYVERIFY'
          import sys
          import zipfile

          expected = [
              ("arm64-v8a",),
              ("armeabi-v7a",),
              ("arm64-v8a", "armeabi-v7a"),
          ]

          for apk, abis in zip(sys.argv[1:], expected):
              with zipfile.ZipFile(apk) as z:
                  for abi in abis:
                      for lib in (
                          "libaether.so",
                          "libc++_shared.so",
                          "libsamanbridge.so",
                          "libhev-socks5-tunnel.so",
                          "libpsiphon-tunnel-core.so",
                          "libxray.so",
                          "libxray-guard.so",
                      ):
                          info = z.getinfo(f"lib/{abi}/{lib}")
                          assert info.file_size > 0, (apk, abi, lib)
          PYVERIFY

          V="${RELEASE_TAG#v}"

          for APK in "$A64" "$A32" "$UNI"; do
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              verify --verbose --print-certs "$APK")"

            grep -q \
              "certificate SHA-256 digest: $RELEASE_CERT_SHA256" \
              <<<"$CERTS"

            BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "sdkVersion:'24'" <<<"$BADGING"

            grep -q "package: name='com.saman.tunnel' versionCode='20200' versionName='${V}'" <<<"$BADGING"
            grep -q "versionName='${V}'" <<<"$BADGING"
            grep -q "application-label:'Saman Tunnel'" <<<"$BADGING"
          done

      - name: Prepare release files
        run: |
          set -euxo pipefail

          O="android-app/app/build/outputs/apk"
          T="$RELEASE_TAG"

          mkdir -p dist

          cp "$(find "$O" -type f -name '*arm64-v8a*release*.apk' -print -quit)" \
            "dist/Saman-Tunnel-${T}-arm64-v8a.apk"

          cp "$(find "$O" -type f -name '*armeabi-v7a*release*.apk' -print -quit)" \
            "dist/Saman-Tunnel-${T}-armeabi-v7a.apk"

          cp "$(find "$O" -type f -name '*universal*release*.apk' -print -quit)" \
            "dist/Saman-Tunnel-${T}-universal-arm.apk"

          cd dist
          sha256sum ./*.apk > SHA256SUMS

          for APK in *.apk; do
            sha256sum "$APK" > "${APK}.sha256"
          done

          ls -lh

      - name: Release notes
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"

          awk -v heading="## $TAG" '
            $0 == heading { found=1 }
            found && $0 ~ /^## / && $0 != heading { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            printf '# Saman Tunnel %s\n\nSee CHANGELOG.md for details.\n' \
              "$TAG" > /tmp/notes.md
          fi

          cat >> /tmp/notes.md <<'NOTES'

          Stable APKs:
          - ARM64
          - ARMv7
          - Universal ARM

          This Android-only release bundles official Aether v2.3.0 (with official
          Psiphon console clients for ARM64/ARMv7), HEV 2.20.0, and a separate
          Xray-core v26.11.9 static executable for each ARM ABI. Android minSdk remains 24.

          Verify APK SHA-256 hashes and signing-certificate continuity before installation.
          NOTES

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saman-tunnel-v2.2.0-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub draft release (tag push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Saman Tunnel $RELEASE_TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            --draft
