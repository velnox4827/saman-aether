name: Release Saman Tunnel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  AETHER_COMMIT: "e05cbd78b8f17873abee553904a85610b88c0382"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Saman Tunnel
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Checkout pinned Aether Core
        run: |
          mkdir -p "$RUNNER_TEMP/Aether"
          git -C "$RUNNER_TEMP/Aether" init
          git -C "$RUNNER_TEMP/Aether" remote add origin https://github.com/CluvexStudio/Aether.git
          git -C "$RUNNER_TEMP/Aether" fetch --depth 1 origin "$AETHER_COMMIT"
          git -C "$RUNNER_TEMP/Aether" checkout --detach FETCH_HEAD

      - name: Build Aether shared library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          cd "$RUNNER_TEMP/Aether/aether"
          cargo ndk -t arm64-v8a --platform 24 build --release --lib
          mkdir -p "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/libaether.so \
            "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a/libaether.so"

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAMAN_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/saman-tunnel-release.jks"

      - name: Build signed release APK
        working-directory: android-app
        env:
          STORE_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAMAN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PSAMAN_KEYSTORE_FILE="$RUNNER_TEMP/saman-tunnel-release.jks" \
            -PSAMAN_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PSAMAN_KEY_ALIAS="$KEY_ALIAS" \
            -PSAMAN_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify native dependencies and APK signature
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          unzip -p "$APK" lib/arm64-v8a/libsamanbridge.so > /tmp/libsamanbridge.so

          if readelf -d /tmp/libsamanbridge.so | grep -q "/home/runner"; then
            echo "ERROR: build-machine path leaked into native dependencies"
            exit 1
          fi

          readelf -d /tmp/libsamanbridge.so | grep -q "Shared library: \[libaether.so\]"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libaether.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsamanbridge.so"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare release files
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="Saman-Tunnel-${TAG}-arm64.apk"
          cp android-app/app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

          cat > /tmp/release-notes.md <<'NOTES'
          # Saman Tunnel v1.2.1

          Stable UI polish update for Saman Tunnel.

          ## What's fixed

          - The top status card is now structured cleanly for every runtime state
          - Long messages no longer run outside the screen
          - `Connection unstable` is shown as a short status line
          - SOCKS5 checking information is shown on a separate detail line
          - Error details can wrap safely inside the status card
          - Starting / Connecting / Switching / Stopping states use the same consistent layout
          - Connected mode keeps proxy information on its own line

          ## Local proxies

          SOCKS5:
          `127.0.0.1:1819`

          HTTP CONNECT:
          `127.0.0.1:1820`

          Aether Core: v1.7.0

          All v1.2.0 networking features are retained.

          ## Support

          Telegram:
          https://t.me/SamanTunnel

          GitHub:
          https://github.com/velnox4827/saman-aether

          **Privacy note:** diagnostics may contain IP addresses, endpoints and error details. Review TXT reports before posting them publicly.

          Source code is available under GNU AGPL-3.0.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="Saman-Tunnel-${TAG}-arm64.apk"
          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Saman Tunnel $TAG" \
            --notes-file /tmp/release-notes.md \
            --latest
