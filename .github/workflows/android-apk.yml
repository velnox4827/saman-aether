name: Build Saman Tunnel APKs
run-name: "Saman Tunnel v2.2.0 • ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Also build a signed release (requires release secrets)
        type: boolean
        default: false
  push:
    branches: [main, "release/**", vpn-debug-hev]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  AETHER_COMMIT: "6175b67df370ab856bcee07fe85b524031903956"
  RELEASE_CERT_SHA256: "03233edadf89ed27c7cf80452916a7bd25e8c74abe0f12d2eefcb8b290b48805"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: 'recursive'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install pinned Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify and retain signed v2.1.0 Aether 2.3.0 / Psiphon binaries
        run: bash android-app/scripts/stage-retained-aether.sh

      - name: Go 1.27.3 for pinned Xray-core
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and validate Xray-core v26.11.9 (both ARM ABIs)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: bash android-app/scripts/build-xray.sh

      - name: Build official HEV 2.20.0 tun2socks
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          HEV="$GITHUB_WORKSPACE/android-app/third_party/hev-socks5-tunnel"
          HEV_OUT="$RUNNER_TEMP/hev-libs"
          APP_LIBS="$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs"
          OBJ="$RUNNER_TEMP/hev-obj"
          test "$(git -C "$HEV" rev-parse HEAD)" = "75dbc1e9ace6c70d3d1b94df7c283efe1de7effc"
          "$ANDROID_NDK_HOME/ndk-build" \
            -C "$HEV" \
            NDK_PROJECT_PATH="$HEV" \
            APP_BUILD_SCRIPT="$HEV/Android.mk" \
            NDK_APPLICATION_MK="$HEV/Application.mk" \
            NDK_LIBS_OUT="$HEV_OUT" \
            NDK_OUT="$OBJ" \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM="android-24" \
            APP_CFLAGS="-O3 -DANDROID -DPKGNAME=com/saman/tunnel -DCLSNAME=HevBridge"
          test -s "$HEV_OUT/arm64-v8a/libhev-socks5-tunnel.so"
          test -s "$HEV_OUT/armeabi-v7a/libhev-socks5-tunnel.so"

          # Preserve Aether: build HEV outside app/src/main/jniLibs.
          test -s "$APP_LIBS/arm64-v8a/libaether.so"
          test -s "$APP_LIBS/armeabi-v7a/libaether.so"

          install -Dm755 "$HEV_OUT/arm64-v8a/libhev-socks5-tunnel.so" "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so"
          install -Dm755 "$HEV_OUT/armeabi-v7a/libhev-socks5-tunnel.so" "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"

          # Both native engines must coexist before Gradle/CMake starts.
          test -s "$APP_LIBS/arm64-v8a/libaether.so"
          test -s "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so"
          test -s "$APP_LIBS/armeabi-v7a/libaether.so"
          test -s "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"

          echo "ARM64 native libs:"
          ls -lh "$APP_LIBS/arm64-v8a/libaether.so" "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so"
          echo "ARMv7 native libs:"
          ls -lh "$APP_LIBS/armeabi-v7a/libaether.so" "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"

          sha256sum \
            "$APP_LIBS/arm64-v8a/libaether.so" \
            "$APP_LIBS/arm64-v8a/libhev-socks5-tunnel.so" \
            "$APP_LIBS/armeabi-v7a/libaether.so" \
            "$APP_LIBS/armeabi-v7a/libhev-socks5-tunnel.so"
      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace --console=plain
      - name: Android lint
        working-directory: android-app
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace --console=plain
      - name: Build debug APKs
        working-directory: android-app
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify debug APKs
        run: |
          set -euxo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*debug*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*debug*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*debug*.apk' -print -quit)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"
          for APK in "$A64" "$A32" "$UNI"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "sdkVersion:'24'" <<<"$B"
            grep -q "package: name='com.saman.tunnel.debug' versionCode='20200' versionName='2.2.0'" <<<"$B"
          done
          python3 - "$A64" "$A32" "$UNI" <<'PYVERIFY'
          import sys, zipfile
          for apk, abis in zip(sys.argv[1:], [("arm64-v8a",), ("armeabi-v7a",), ("arm64-v8a", "armeabi-v7a")]):
              with zipfile.ZipFile(apk) as archive:
                  for abi in abis:
                      for lib in ("libaether.so", "libc++_shared.so", "libsamanbridge.so", "libhev-socks5-tunnel.so", "libpsiphon-tunnel-core.so", "libxray.so", "libxray-guard.so"):
                          assert archive.getinfo(f"lib/{abi}/{lib}").file_size > 0, (apk, abi, lib)
          PYVERIFY
          mkdir -p dist
          cp "$A64" dist/Saman-Tunnel-v2.2.0-arm64-v8a-debug.apk
          cp "$A32" dist/Saman-Tunnel-v2.2.0-armeabi-v7a-debug.apk
          cp "$UNI" dist/Saman-Tunnel-v2.2.0-universal-arm-debug.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saman-tunnel-v2.2.0-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Restore release signing identity
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          KEYSTORE_B64: ${{ secrets.SAMAN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/saman-release.jks"
      - name: Build signed release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        working-directory: android-app
        env:
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_FILE: ${{ runner.temp }}/saman-release.jks
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_ALIAS: ${{ secrets.SAMAN_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signed release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: |
          set -euo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*release*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*release*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*release*.apk' -print -quit)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"
          mkdir -p dist-release
          for APK in "$A64" "$A32" "$UNI"; do
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
            grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<<"$CERTS"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "sdkVersion:'24'" <<<"$B"
            grep -q "package: name='com.saman.tunnel' versionCode='20200' versionName='2.2.0'" <<<"$B"
          done
          python3 - "$A64" "$A32" "$UNI" <<'PYVERIFY'
          import sys, zipfile
          for apk, abis in zip(sys.argv[1:], [("arm64-v8a",), ("armeabi-v7a",), ("arm64-v8a", "armeabi-v7a")]):
              with zipfile.ZipFile(apk) as archive:
                  for abi in abis:
                      for lib in ("libaether.so", "libc++_shared.so", "libsamanbridge.so", "libhev-socks5-tunnel.so", "libpsiphon-tunnel-core.so", "libxray.so", "libxray-guard.so"):
                          assert archive.getinfo(f"lib/{abi}/{lib}").file_size > 0, (apk, abi, lib)
          PYVERIFY
          cp "$A64" dist-release/Saman-Tunnel-v2.2.0-arm64-v8a.apk
          cp "$A32" dist-release/Saman-Tunnel-v2.2.0-armeabi-v7a.apk
          cp "$UNI" dist-release/Saman-Tunnel-v2.2.0-universal-arm.apk
          (cd dist-release && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        with:
          name: saman-tunnel-v2.2.0-release
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saman-tunnel-v2.2.0-checks
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    # Launch Main, Settings, Debug on real emulators; any crash fails the build.
    # x86_64 API 30+ images run the arm APK via built-in ARM translation.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: saman-tunnel-v2.2.0-debug
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: android-app/smoke-test.sh dist/Saman-Tunnel-v2.2.0-universal-arm-debug.apk smoke-out
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-api${{ matrix.api }}
          path: smoke-out
          if-no-files-found: ignore

