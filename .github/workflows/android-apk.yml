name: Build Saman Tunnel APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Saman project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Checkout pinned Aether Core
        run: |
          mkdir -p "$RUNNER_TEMP/Aether"
          git -C "$RUNNER_TEMP/Aether" init
          git -C "$RUNNER_TEMP/Aether" remote add origin https://github.com/CluvexStudio/Aether.git
          git -C "$RUNNER_TEMP/Aether" fetch --depth 1 origin e05cbd78b8f17873abee553904a85610b88c0382
          git -C "$RUNNER_TEMP/Aether" checkout --detach FETCH_HEAD

      - name: Build Aether shared library for arm64 Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          cd "$RUNNER_TEMP/Aether/aether"
          cargo ndk -t arm64-v8a --platform 24 build --release --lib
          mkdir -p "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/libaether.so \
            "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a/libaether.so"

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug

      - name: Verify APK native dependencies
        working-directory: android-app
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" lib/arm64-v8a/libsamanbridge.so > /tmp/libsamanbridge.so

          echo "---- libsamanbridge.so dependencies ----"
          readelf -d /tmp/libsamanbridge.so | grep NEEDED || true

          if readelf -d /tmp/libsamanbridge.so | grep -q "/home/runner"; then
            echo "ERROR: build machine path leaked into DT_NEEDED"
            exit 1
          fi

          if ! readelf -d /tmp/libsamanbridge.so | grep -q "Shared library: \[libaether.so\]"; then
            echo "ERROR: libaether.so is not recorded as a normal runtime dependency"
            exit 1
          fi

          unzip -l "$APK" | grep -q "lib/arm64-v8a/libaether.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsamanbridge.so"

          echo "Native dependency verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saman-tunnel-arm64-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
