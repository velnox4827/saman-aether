name: Build Saman Tunnel APKs
run-name: "Saman Tunnel v1.9.0 • ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Also build a signed release (requires release secrets)
        type: boolean
        default: false
  push:
    branches: [main, "release/**", vpn-debug-hev]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  AETHER_COMMIT: "0e6f6a5218e65ed4cddc68d1a71d9b9633f89e3f"
  CARGO_NDK_VERSION: "4.1.2"
  RELEASE_CERT_SHA256: "03233edadf89ed27c7cf80452916a7bd25e8c74abe0f12d2eefcb8b290b48805"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: 'recursive'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install pinned Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.0"
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Checkout official Aether Core v2.0.0
        run: |
          set -euxo pipefail
          git init "$RUNNER_TEMP/Aether"
          git -C "$RUNNER_TEMP/Aether" remote add origin https://github.com/CluvexStudio/Aether.git
          git -C "$RUNNER_TEMP/Aether" fetch --depth 1 origin "$AETHER_COMMIT"
          git -C "$RUNNER_TEMP/Aether" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/Aether" rev-parse HEAD)" = "$AETHER_COMMIT"
          grep -q '^version = "2.0.0"$' "$RUNNER_TEMP/Aether/aether/Cargo.toml"
          grep -q '^rust-version = "1.98"$' "$RUNNER_TEMP/Aether/aether/Cargo.toml"
      - name: Build native libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/Aether/aether"
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 24 build --release --lib --features tor
          install -Dm755 target/aarch64-linux-android/release/libaether.so "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a/libaether.so"
          install -Dm755 target/armv7-linux-androideabi/release/libaether.so "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/armeabi-v7a/libaether.so"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Zeptun 1.1.1
        working-directory: android-app/third_party/zeptun
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          zig build android -Doptimize=ReleaseSmall
          CPP="$GITHUB_WORKSPACE/android-app/app/src/main/cpp"
          rm -rf "$CPP/zeptun-libs" "$CPP/zeptun-include"
          mkdir -p "$CPP/zeptun-libs/arm64-v8a" "$CPP/zeptun-libs/armeabi-v7a" "$CPP/zeptun-include"
          cp zig-out/android/prebuilt/arm64-v8a/libzeptun.a "$CPP/zeptun-libs/arm64-v8a/"
          cp zig-out/android/prebuilt/armeabi-v7a/libzeptun.a "$CPP/zeptun-libs/armeabi-v7a/"
          cp include/zeptun.h "$CPP/zeptun-include/"
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE/android-app/app/src/main/cpp" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/android-app/app/src/main/cpp/Android.mk" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs" \
            NDK_OUT="$RUNNER_TEMP/zeptun-ndk-obj" \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM="android-24"
          test -s "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a/libzeptun-jni.so"
          test -s "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/armeabi-v7a/libzeptun-jni.so"
      - name: Android unit tests
        working-directory: android-app
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace --console=plain
      - name: Android lint
        working-directory: android-app
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace --console=plain
      - name: Build debug APKs
        working-directory: android-app
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify debug APKs
        run: |
          set -euxo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*debug*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*debug*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*debug*.apk' -print -quit)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"
          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libzeptun-jni.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libzeptun-jni.so'
          unzip -l "$UNI" | grep -q 'lib/arm64-v8a/libzeptun-jni.so'
          unzip -l "$UNI" | grep -q 'lib/armeabi-v7a/libzeptun-jni.so'
          for APK in "$A64" "$A32" "$UNI"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "package: name='com.saman.tunnel.debug' versionCode='190' versionName='1.9.0'" <<<"$B"
          done
          python3 - "$A64" "$A32" "$UNI" <<'PYVERIFY'
          import sys, zipfile
          for apk, abis in zip(sys.argv[1:], [("arm64-v8a",), ("armeabi-v7a",), ("arm64-v8a", "armeabi-v7a")]):
              with zipfile.ZipFile(apk) as archive:
                  for abi in abis:
                      for lib in ("libaether.so", "libsamanbridge.so", "libzeptun-jni.so"):
                          assert archive.getinfo(f"lib/{abi}/{lib}").file_size > 0, (apk, abi, lib)
          PYVERIFY
          mkdir -p dist
          cp "$A64" dist/Saman-Tunnel-v1.9.0-arm64-v8a-debug.apk
          cp "$A32" dist/Saman-Tunnel-v1.9.0-armeabi-v7a-debug.apk
          cp "$UNI" dist/Saman-Tunnel-v1.9.0-universal-arm-debug.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saman-tunnel-v1.9.0-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Restore release signing identity
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          KEYSTORE_B64: ${{ secrets.SAMAN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/saman-release.jks"
      - name: Build signed release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        working-directory: android-app
        env:
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_FILE: ${{ runner.temp }}/saman-release.jks
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_ALIAS: ${{ secrets.SAMAN_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signed release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        run: |
          set -euo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*release*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*release*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*release*.apk' -print -quit)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"
          mkdir -p dist-release
          for APK in "$A64" "$A32" "$UNI"; do
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
            grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<<"$CERTS"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "package: name='com.saman.tunnel' versionCode='190' versionName='1.9.0'" <<<"$B"
          done
          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libaether.so'
          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libsamanbridge.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libaether.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libsamanbridge.so'
          unzip -l "$UNI" | grep -q 'lib/arm64-v8a/libaether.so'
          unzip -l "$UNI" | grep -q 'lib/armeabi-v7a/libaether.so'
          cp "$A64" dist-release/Saman-Tunnel-v1.9.0-arm64-v8a.apk
          cp "$A32" dist-release/Saman-Tunnel-v1.9.0-armeabi-v7a.apk
          cp "$UNI" dist-release/Saman-Tunnel-v1.9.0-universal-arm.apk
          (cd dist-release && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        with:
          name: saman-tunnel-v1.9.0-release
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saman-tunnel-v1.9.0-checks
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
