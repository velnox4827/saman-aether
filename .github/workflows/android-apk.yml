name: Build Saman Tunnel v1.6.0 APKs

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  AETHER_COMMIT: "311b573352bb67e494895ff67d20b002d075116a"
  CARGO_NDK_VERSION: "4.1.2"
  RELEASE_CERT_SHA256: "03233edadf89ed27c7cf80452916a7bd25e8c74abe0f12d2eefcb8b290b48805"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.89.0"
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Checkout pinned Aether Core
        run: |
          set -euxo pipefail
          git init "$RUNNER_TEMP/Aether"
          git -C "$RUNNER_TEMP/Aether" remote add origin https://github.com/CluvexStudio/Aether.git
          git -C "$RUNNER_TEMP/Aether" fetch --depth 1 origin "$AETHER_COMMIT"
          git -C "$RUNNER_TEMP/Aether" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/Aether" rev-parse HEAD)" = "$AETHER_COMMIT"
          grep -q '^version = "1.9.0"$' "$RUNNER_TEMP/Aether/aether/Cargo.toml"
      - name: Apply verified Saman patches
        run: |
          set -euxo pipefail
          for PATCH in android-app/aether-patches/smart-reconnect-all-modes.patch android-app/aether-patches/local-proxy-reuseaddr.patch; do
            test -s "$PATCH"
            git -C "$RUNNER_TEMP/Aether" apply --check "$GITHUB_WORKSPACE/$PATCH"
            git -C "$RUNNER_TEMP/Aether" apply "$GITHUB_WORKSPACE/$PATCH"
          done
          grep -q 'smart reconnect WG' "$RUNNER_TEMP/Aether/aether/src/lib.rs"
          grep -q 'smart reconnect MASQUE' "$RUNNER_TEMP/Aether/aether/src/lib.rs"
          grep -q 'smart reconnect GOOL' "$RUNNER_TEMP/Aether/aether/src/lib.rs"
          grep -q 'bind_reusable_tcp_listener' "$RUNNER_TEMP/Aether/aether/src/socks.rs"
          grep -q 'set_reuseaddr(true)' "$RUNNER_TEMP/Aether/aether/src/socks.rs"
      - name: Build native libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/Aether/aether"
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 24 build --release --lib
          install -Dm755 target/aarch64-linux-android/release/libaether.so "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/arm64-v8a/libaether.so"
          install -Dm755 target/armv7-linux-androideabi/release/libaether.so "$GITHUB_WORKSPACE/android-app/app/src/main/jniLibs/armeabi-v7a/libaether.so"
      - name: Unit tests and lint
        working-directory: android-app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build debug APKs
        working-directory: android-app
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify debug APKs
        run: |
          set -euxo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*debug*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*debug*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*debug*.apk' -print -quit)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"
          for APK in "$A64" "$A32" "$UNI"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "package: name='com.saman.tunnel' versionCode='160' versionName='1.6.0'" <<<"$B"
          done
          mkdir -p dist
          cp "$A64" dist/Saman-Tunnel-v1.6.0-arm64-v8a-debug.apk
          cp "$A32" dist/Saman-Tunnel-v1.6.0-armeabi-v7a-debug.apk
          cp "$UNI" dist/Saman-Tunnel-v1.6.0-universal-arm-debug.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saman-tunnel-v1.6.0-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Restore release signing identity
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.SAMAN_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/saman-release.jks"
      - name: Build signed release APKs
        if: github.event_name == 'workflow_dispatch'
        working-directory: android-app
        env:
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_FILE: ${{ runner.temp }}/saman-release.jks
          ORG_GRADLE_PROJECT_SAMAN_KEYSTORE_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_ALIAS: ${{ secrets.SAMAN_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAMAN_KEY_PASSWORD: ${{ secrets.SAMAN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signed release APKs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          O="android-app/app/build/outputs/apk"
          A64="$(find "$O" -type f -name '*arm64-v8a*release*.apk' -print -quit)"
          A32="$(find "$O" -type f -name '*armeabi-v7a*release*.apk' -print -quit)"
          UNI="$(find "$O" -type f -name '*universal*release*.apk' -print -quit)"
          test -f "$A64"; test -f "$A32"; test -f "$UNI"
          mkdir -p dist-release
          for APK in "$A64" "$A32" "$UNI"; do
            CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")"
            grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256" <<<"$CERTS"
            B="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
            grep -q "package: name='com.saman.tunnel' versionCode='160' versionName='1.6.0'" <<<"$B"
          done
          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libaether.so'
          unzip -l "$A64" | grep -q 'lib/arm64-v8a/libsamanbridge.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libaether.so'
          unzip -l "$A32" | grep -q 'lib/armeabi-v7a/libsamanbridge.so'
          unzip -l "$UNI" | grep -q 'lib/arm64-v8a/libaether.so'
          unzip -l "$UNI" | grep -q 'lib/armeabi-v7a/libaether.so'
          cp "$A64" dist-release/Saman-Tunnel-v1.6.0-arm64-v8a.apk
          cp "$A32" dist-release/Saman-Tunnel-v1.6.0-armeabi-v7a.apk
          cp "$UNI" dist-release/Saman-Tunnel-v1.6.0-universal-arm.apk
          (cd dist-release && sha256sum ./*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch'
        with:
          name: saman-tunnel-v1.6.0-release
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30
